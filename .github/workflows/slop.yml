name: New Build GKI 6.6.77 + DroidSpaces

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Kernel manifest branch"
        required: true
        default: "common-android15-6.6-2025-03"

      kabi_patch:
        description: "DroidSpaces SYSVIPC kABI patch"
        required: true
        default: "001-fix-sysvipc-kabi.patch"

      lto_mode:
        description: "LTO mode"
        required: true
        type: choice
        options:
          - none
          - thin
        default: none

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            rsync \
            unzip \
            zip \
            cpio \
            pahole \
            dwarves \
            zstd \
            xz-utils \
            lz4 \
            jq

      # ============================================================
      # INSTALL REPO
      # ============================================================

      - name: Install repo tool
        run: |
          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          export PATH="${HOME}/bin:${PATH}"

          echo "repo location:"
          command -v repo

          echo "repo version:"
          repo --version

      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ============================================================
      # INIT ANDROID KERNEL SOURCE
      # ============================================================

      - name: Initialize Android kernel repository
        run: |
          mkdir -p android-kernel
          cd android-kernel

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ github.event.inputs.manifest_branch }}" \
            --depth=1

      # ============================================================
      # FIX DEPRECATED KERNEL BRANCH
      # ============================================================

      - name: Fix deprecated kernel branch
        run: |
          cd android-kernel

          echo "=========================================="
          echo "Checking kernel branch"
          echo "=========================================="

          FORMATTED_BRANCH="${{ github.event.inputs.manifest_branch }}"

          # Remove common- prefix
          FORMATTED_BRANCH="${FORMATTED_BRANCH#common-}"

          echo "Formatted branch:"
          echo "${FORMATTED_BRANCH}"

          DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"

          REMOTE_BRANCH="$(
            git ls-remote \
              https://android.googlesource.com/kernel/common \
              "${FORMATTED_BRANCH}"
          )"

          echo
          echo "Remote branch lookup:"
          echo "${REMOTE_BRANCH}"

          if grep -q deprecated <<< "${REMOTE_BRANCH}"; then
            echo
            echo "Found deprecated branch:"
            echo "${FORMATTED_BRANCH}"

            sed -i \
              "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" \
              "${DEFAULT_MANIFEST_PATH}"

            echo
            echo "Manifest after deprecated fix:"
            grep -n \
              "deprecated/${FORMATTED_BRANCH}" \
              "${DEFAULT_MANIFEST_PATH}" || true
          else
            echo
            echo "Branch is not marked deprecated."
          fi

      # ============================================================
      # SYNC KERNEL SOURCE
      # ============================================================

      - name: Sync kernel source
        run: |
          cd android-kernel

          echo "=========================================="
          echo "Syncing kernel source"
          echo "=========================================="

          repo --trace sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --fail-fast

      # ============================================================
      # SHOW SOURCE REVISION
      # ============================================================

      - name: Show source revision
        run: |
          cd android-kernel

          echo "=========================================="
          echo "Kernel source revision"
          echo "=========================================="

          repo manifest -r | head -100

          echo
          echo "common revision:"
          git -C common rev-parse HEAD

          echo
          echo "common status:"
          git -C common status --short

      # ============================================================
      # BYPASS STRICT DEFCONFIG CHECK
      # ============================================================

      - name: Bypass strict defconfig check
        run: |
          cd android-kernel/common

          echo "Before:"
          grep -n "check_defconfig" build.config.gki || true

          sed -i '/check_defconfig/d' build.config.gki

          echo
          echo "After:"
          grep -n "check_defconfig" build.config.gki || true

      # ============================================================
      # APPLY DROIDSPACES KABI PATCH
      # ============================================================

      - name: Apply DroidSpaces kABI patch
        run: |
          cd android-kernel/common

          PATCH="../../patches/${{ github.event.inputs.kabi_patch }}"

          echo "=========================================="
          echo "Applying DroidSpaces kABI patch"
          echo "=========================================="

          echo "Patch:"
          echo "${PATCH}"

          if [ ! -f "${PATCH}" ]; then
            echo "ERROR: Patch not found!"
            echo "Expected:"
            echo "${PATCH}"
            exit 1
          fi

          patch -p1 < "${PATCH}"

          echo
          echo "Patch applied successfully."

      # ============================================================
      # VERIFY KABI PATCH
      # ============================================================

      - name: Verify SYSVIPC kABI patch
        run: |
          cd android-kernel/common

          echo "=========================================="
          echo "SYSVIPC kABI patch result"
          echo "=========================================="

          git diff -- \
            include/linux/sched.h \
            build.config.gki \
            arch/arm64/configs/gki_defconfig || true

      # ============================================================
      # ENABLE DROIDSPACES CONFIG
      #
      # Same config set used by Wild Kernel action.yml
      # ============================================================

      - name: Enable DroidSpaces kernel configs
        run: |
          cd android-kernel/common

          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("arch/arm64/configs/gki_defconfig")

          configs = [
              "CONFIG_PID_NS=y",
              "CONFIG_SYSVIPC=y",
              "CONFIG_POSIX_MQUEUE=y",
              "CONFIG_IPC_NS=y",
              "CONFIG_DEVTMPFS=y",
              "CONFIG_BINFMT_MISC=y",
              "CONFIG_BINFMT_SCRIPT=y",
              "CONFIG_BINFMT_ELF=y",
              "CONFIG_USER_NS=y",
          ]

          names = [line.split("=")[0] for line in configs]

          text = config.read_text()

          # Remove existing definitions for controlled configs.
          for name in names:
              text = re.sub(
                  rf"^{re.escape(name)}=.*\n",
                  "",
                  text,
                  flags=re.MULTILINE,
              )

              text = re.sub(
                  rf"^# {re.escape(name)} is not set\n",
                  "",
                  text,
                  flags=re.MULTILINE,
              )

          # Append DroidSpaces configuration.
          text = text.rstrip() + "\n\n"

          for line in configs:
              text += line + "\n"

          config.write_text(text)
          PY

          echo "=========================================="
          echo "DroidSpaces configs"
          echo "=========================================="

          grep -E \
            '^(CONFIG_PID_NS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_DEVTMPFS|CONFIG_BINFMT_MISC|CONFIG_BINFMT_SCRIPT|CONFIG_BINFMT_ELF|CONFIG_USER_NS)=' \
            arch/arm64/configs/gki_defconfig || true

      # ============================================================
      # MODULE SIGNATURE COMPATIBILITY
      # ============================================================

      - name: Disable forced module signature
        run: |
          cd android-kernel/common

          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("arch/arm64/configs/gki_defconfig")

          text = config.read_text()

          text = re.sub(
              r"^CONFIG_MODULE_SIG_FORCE=.*\n",
              "",
              text,
              flags=re.MULTILINE,
          )

          text = re.sub(
              r"^# CONFIG_MODULE_SIG_FORCE is not set\n",
              "",
              text,
              flags=re.MULTILINE,
          )

          text = text.rstrip() + "\n"
          text += "# CONFIG_MODULE_SIG_FORCE is not set\n"

          config.write_text(text)
          PY

          echo "MODULE_SIG_FORCE:"
          grep -n \
            "MODULE_SIG_FORCE" \
            arch/arm64/configs/gki_defconfig || true

      # ============================================================
      # SHOW DEFCONFIG CHANGES
      # ============================================================

      - name: Show defconfig changes
        run: |
          cd android-kernel/common

          echo "=========================================="
          echo "gki_defconfig diff"
          echo "=========================================="

          git diff -- arch/arm64/configs/gki_defconfig

      # ============================================================
      # BUILD GKI
      # ============================================================

      - name: Build GKI
        run: |
          cd android-kernel

          echo "=========================================="
          echo "Building GKI 6.6.77"
          echo "=========================================="

          echo "Manifest branch:"
          echo "${{ github.event.inputs.manifest_branch }}"

          echo
          echo "LTO mode:"
          echo "${{ github.event.inputs.lto_mode }}"

          echo
          echo "Starting Bazel build..."

          tools/bazel build \
            --config=fast \
            --lto="${{ github.event.inputs.lto_mode }}" \
            //common:kernel_aarch64_dist

      # ============================================================
      # LOCATE BUILD OUTPUT
      # ============================================================

      - name: Locate build artifacts
        run: |
          cd android-kernel

          echo "=========================================="
          echo "Build artifacts"
          echo "=========================================="

          find bazel-bin/common \
            -maxdepth 6 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.lz4" \
              -o -name "vmlinux" \
              -o -name "System.map" \
              -o -name "Module.symvers" \
              -o -name ".config" \
            \) \
            -print 2>/dev/null || true

      # ============================================================
      # PREPARE KERNEL IMAGE
      # ============================================================

      - name: Prepare kernel Image
        run: |
          cd android-kernel

          mkdir -p ../kernel-artifact

          IMAGE=""

          if [ -f bazel-bin/common/kernel_aarch64/Image ]; then
            IMAGE="bazel-bin/common/kernel_aarch64/Image"

          elif [ -f bazel-bin/common/kernel_aarch64/Image.lz4 ]; then
            IMAGE="bazel-bin/common/kernel_aarch64/Image.lz4"

          else
            IMAGE="$(find bazel-bin/common \
              -type f \
              \( \
                -name Image \
                -o -name Image.lz4 \
              \) \
              | head -n 1)"
          fi

          if [ -z "${IMAGE}" ]; then
            echo "ERROR: Kernel Image not found."
            exit 1
          fi

          echo "Found kernel image:"
          echo "${IMAGE}"

          cp "${IMAGE}" ../kernel-artifact/

      # ============================================================
      # COLLECT BUILD INFO
      # ============================================================

      - name: Collect build metadata
        run: |
          cd android-kernel/common

          mkdir -p ../../build-debug

          {
            echo "=========================================="
            echo "DroidSpaces GKI Build Information"
            echo "=========================================="
            echo

            echo "Manifest branch:"
            echo "${{ github.event.inputs.manifest_branch }}"
            echo

            echo "LTO mode:"
            echo "${{ github.event.inputs.lto_mode }}"
            echo

            echo "Kernel commit:"
            git rev-parse HEAD
            echo

            echo "Kernel version:"
            make kernelversion 2>/dev/null || true
            echo

            echo "Git status:"
            git status --short
            echo

            echo "DroidSpaces configs:"
            grep -E \
              '^(CONFIG_PID_NS|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_DEVTMPFS|CONFIG_BINFMT_MISC|CONFIG_BINFMT_SCRIPT|CONFIG_BINFMT_ELF|CONFIG_USER_NS|CONFIG_MODULE_SIG_FORCE)=' \
              arch/arm64/configs/gki_defconfig || true

            echo
            echo "Git diff:"
            git diff

          } > ../../build-debug/build-info.txt

      # ============================================================
      # SAVE FINAL DEFCONFIG
      # ============================================================

      - name: Save final defconfig
        run: |
          cd android-kernel/common

          if [ -f arch/arm64/configs/gki_defconfig ]; then
            cp \
              arch/arm64/configs/gki_defconfig \
              ../../build-debug/gki_defconfig.final
          fi

      # ============================================================
      # COLLECT DEBUG FILES
      # ============================================================

      - name: Collect debug files
        run: |
          cd android-kernel

          mkdir -p ../build-debug

          find bazel-bin/common \
            -type f \
            \( \
              -name "vmlinux" \
              -o -name "System.map" \
              -o -name "Module.symvers" \
              -o -name ".config" \
            \) \
            -exec cp -f {} ../build-debug/ \; \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "Debug files"
          echo "=========================================="

          find ../build-debug \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6.77-DroidSpaces-${{ github.event.inputs.lto_mode }}
          path: kernel-artifact/
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # UPLOAD DEBUG
      # ============================================================

      - name: Upload build debug
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6.77-DroidSpaces-debug-${{ github.event.inputs.lto_mode }}
          path: build-debug/
          if-no-files-found: warn
          compression-level: 6
