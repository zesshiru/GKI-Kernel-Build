name: New Build GKI 6.6.77 + DroidSpaces

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'Branch manifest kernel'
        default: 'common-android15-6.6-2025-03'
        required: true

      kabi_patch:
        description: 'Nama file patch kABI di folder patches/'
        default: '001-fix-sysvipc-kabi.patch'
        required: true

      lto_mode:
        description: 'LTO mode'
        type: choice
        options:
          - none
          - thin
        default: none
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            python3-pip \
            bc \
            libssl-dev \
            libelf-dev \
            pahole

      # ------------------------------------------------------------
      # 3. Install repo
      # ------------------------------------------------------------
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # 4. Git identity
      # ------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ------------------------------------------------------------
      # 5. Init Android GKI manifest
      # ------------------------------------------------------------
      - name: Init kernel manifest
        run: |
          mkdir -p android-kernel

          cd android-kernel

          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ github.event.inputs.manifest_branch }}"

      # ------------------------------------------------------------
      # 6. Sync source
      # ------------------------------------------------------------
      - name: Sync kernel source
        run: |
          cd android-kernel

          FORMATTED_BRANCH="${{ github.event.inputs.manifest_branch }}"
          FORMATTED_BRANCH="${FORMATTED_BRANCH#common-}"

          REMOTE_BRANCH="$(
            git ls-remote \
              https://android.googlesource.com/kernel/common \
              "${FORMATTED_BRANCH}"
          )"

          DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"

          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            echo "Branch deprecated."

            sed -i \
              "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" \
              "$DEFAULT_MANIFEST_PATH"
          fi

          repo sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --fail-fast

      # ------------------------------------------------------------
      # 7. Show exact source revision
      # ------------------------------------------------------------
      - name: Show kernel source revision
        run: |
          cd android-kernel/common

          echo "=== HEAD ==="
          git log -1 --oneline

          echo
          echo "=== STATUS ==="
          git status --short

          echo
          echo "=== KERNEL VERSION ==="
          make kernelversion || true

      # ------------------------------------------------------------
      # 8. Bypass strict defconfig check
      # ------------------------------------------------------------
      - name: Bypass strict defconfig check
        run: |
          sed -i '/check_defconfig/d' \
            android-kernel/common/build.config.gki

      # ------------------------------------------------------------
      # 9. Apply DroidSpaces kABI patch
      # ------------------------------------------------------------
      - name: Apply DroidSpaces kABI patch
        run: |
          cd android-kernel/common

          echo "Applying:"
          echo "../../patches/${{ github.event.inputs.kabi_patch }}"

          patch \
            -p1 \
            < "../../patches/${{ github.event.inputs.kabi_patch }}"

          echo
          echo "=== PATCH STATUS ==="
          git diff --stat

      # ------------------------------------------------------------
      # 10. Prepare DroidSpaces config
      #
      # IMPORTANT:
      # Do not simply append the fragment blindly and assume that
      # the resulting file is the final kernel configuration.
      # We first make the requested values explicit.
      # ------------------------------------------------------------
      - name: Prepare DroidSpaces configuration
        run: |
          cd android-kernel

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"

          echo "=== DroidSpaces fragment ==="
          cat "../configs/droidspace.fragment"

          echo
          echo "=== Module signature compatibility fragment ==="
          cat "../configs/module-sig-compat.fragment"

          echo
          echo "=== Existing relevant config ==="

          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_DEVTMPFS|CONFIG_NETFILTER_XT_MATCH_ADDRTYPE|CONFIG_NETFILTER_XT_TARGET_REJECT|CONFIG_NETFILTER_XT_TARGET_LOG|CONFIG_NETFILTER_XT_MATCH_RECENT|CONFIG_IP_SET|CONFIG_IP_SET_HASH_IP|CONFIG_IP_SET_HASH_NET|CONFIG_NETFILTER_XT_SET|CONFIG_TMPFS_POSIX_ACL|CONFIG_TMPFS_XATTR|CONFIG_MODULE_SIG_FORCE)=' \
            "$DEFCONFIG" || true

          echo
          echo "=== Applying DroidSpaces config values ==="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("common/arch/arm64/configs/gki_defconfig")

          configs = {
              "CONFIG_SYSVIPC": "y",
              "CONFIG_POSIX_MQUEUE": "y",

              "CONFIG_IPC_NS": "y",
              "CONFIG_PID_NS": "y",

              "CONFIG_DEVTMPFS": "y",

              "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE": "y",

              "CONFIG_NETFILTER_XT_TARGET_REJECT": "y",
              "CONFIG_NETFILTER_XT_TARGET_LOG": "y",
              "CONFIG_NETFILTER_XT_MATCH_RECENT": "y",

              "CONFIG_IP_SET": "y",
              "CONFIG_IP_SET_HASH_IP": "y",
              "CONFIG_IP_SET_HASH_NET": "y",
              "CONFIG_NETFILTER_XT_SET": "y",

              "CONFIG_TMPFS_POSIX_ACL": "y",
              "CONFIG_TMPFS_XATTR": "y",
          }

          lines = path.read_text().splitlines()

          # Remove previous assignments for the configs we control.
          filtered = []

          controlled = set(configs)

          for line in lines:
              stripped = line.strip()

              remove = False

              if stripped.startswith("CONFIG_"):
                  key = stripped.split("=", 1)[0]
                  if key in controlled:
                      remove = True

              if stripped.startswith("# CONFIG_") and stripped.endswith(" is not set"):
                  key = stripped[2:].split(" ", 1)[0]
                  if key in controlled:
                      remove = True

              if not remove:
                  filtered.append(line)

          # Add exactly one assignment for every requested config.
          filtered.append("")
          filtered.append("# DroidSpaces configuration")

          for key, value in configs.items():
              filtered.append(f"{key}={value}")

          path.write_text("\n".join(filtered) + "\n")
          PY

          echo
          echo "=== Module signature compatibility ==="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("common/arch/arm64/configs/gki_defconfig")
          lines = path.read_text().splitlines()

          keys = {"CONFIG_MODULE_SIG_FORCE"}

          filtered = []

          for line in lines:
              stripped = line.strip()

              remove = False

              if stripped.startswith("CONFIG_"):
                  key = stripped.split("=", 1)[0]
                  if key in keys:
                      remove = True

              if stripped.startswith("# CONFIG_") and stripped.endswith(" is not set"):
                  key = stripped[2:].split(" ", 1)[0]
                  if key in keys:
                      remove = True

              if not remove:
                  filtered.append(line)

          filtered.append("# CONFIG_MODULE_SIG_FORCE is not set")

          path.write_text("\n".join(filtered) + "\n")
          PY

          echo
          echo "=== Final gki_defconfig entries ==="

          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_DEVTMPFS|CONFIG_NETFILTER_XT_MATCH_ADDRTYPE|CONFIG_NETFILTER_XT_TARGET_REJECT|CONFIG_NETFILTER_XT_TARGET_LOG|CONFIG_NETFILTER_XT_MATCH_RECENT|CONFIG_IP_SET|CONFIG_IP_SET_HASH_IP|CONFIG_IP_SET_HASH_NET|CONFIG_NETFILTER_XT_SET|CONFIG_TMPFS_POSIX_ACL|CONFIG_TMPFS_XATTR)=|^# CONFIG_MODULE_SIG_FORCE is not set' \
            "$DEFCONFIG"

      # ------------------------------------------------------------
      # 11. Build GKI
      # ------------------------------------------------------------
      - name: Build GKI kernel
        run: |
          cd android-kernel

          tools/bazel build \
            --config=fast \
            --lto="${{ github.event.inputs.lto_mode }}" \
            //common:kernel_aarch64_dist

      # ------------------------------------------------------------
      # 12. Locate all important artifacts
      # ------------------------------------------------------------
      - name: Locate build artifacts
        run: |
          cd android-kernel

          echo "=== Image ==="
          find bazel-bin \
            -type f \
            -name "Image" \
            -print

          echo
          echo "=== vmlinux ==="
          find bazel-bin \
            -type f \
            -name "vmlinux" \
            -print

          echo
          echo "=== Module.symvers ==="
          find bazel-bin \
            -type f \
            -name "Module.symvers" \
            -print

          echo
          echo "=== System.map ==="
          find bazel-bin \
            -type f \
            -name "System.map" \
            -print

          echo
          echo "=== Kernel config ==="
          find bazel-bin \
            -type f \
            \( -name ".config" -o -name "*config*" \) \
            -print

      # ------------------------------------------------------------
      # 13. Save source/build metadata
      # ------------------------------------------------------------
      - name: Collect build metadata
        run: |
          mkdir -p build-debug

          cd android-kernel/common

          echo "=== GIT COMMIT ===" \
            > ../../build-debug/build-info.txt

          git rev-parse HEAD \
            >> ../../build-debug/build-info.txt

          echo \
            >> ../../build-debug/build-info.txt

          echo "=== GIT STATUS ===" \
            >> ../../build-debug/build-info.txt

          git status --short \
            >> ../../build-debug/build-info.txt

          echo \
            >> ../../build-debug/build-info.txt

          echo "=== KERNEL VERSION ===" \
            >> ../../build-debug/build-info.txt

          make kernelversion \
            >> ../../build-debug/build-info.txt \
            2>&1 || true

          echo \
            >> ../../build-debug/build-info.txt

          echo "=== PATCH ===" \
            >> ../../build-debug/build-info.txt

          git diff \
            >> ../../build-debug/build-info.txt

          cd ../..

          cp \
            android-kernel/common/arch/arm64/configs/gki_defconfig \
            build-debug/gki_defconfig.final

      # ------------------------------------------------------------
      # 14. Upload Image
      # ------------------------------------------------------------
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-6.6.77-droidspace
          path: android-kernel/bazel-bin/common/kernel_aarch64/Image
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 15. Upload debugging artifacts
      # ------------------------------------------------------------
      - name: Upload build debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-debug-6.6.77-droidspace
          path: |
            build-debug/
            android-kernel/bazel-bin/**/vmlinux
            android-kernel/bazel-bin/**/System.map
            android-kernel/bazel-bin/**/Module.symvers
            android-kernel/bazel-bin/**/.config
          if-no-files-found: warn
          retention-days: 14
