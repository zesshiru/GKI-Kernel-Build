name: 1000 Slop Later.. Build GKI 6.6.77 + Droidspace

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'Branch manifest kernel'
        default: 'common-android15-6.6-2025-03'
      kabi_patch:
        description: 'Nama file patch kABI di folder patches/'
        default: '001-fix-sysvipc-kabi.patch'
      lto_mode:
        description: 'LTO mode (none = build cepat buat testing, thin = build final)'
        type: choice
        options: ['none', 'thin']
        default: 'none'

env:
  BAZEL_DISK_CACHE: ${{ github.workspace }}/.bazel-cache/disk
  BAZEL_REPO_CACHE: ${{ github.workspace }}/.bazel-cache/repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (patch & config files)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip bc libssl-dev libelf-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Restore Bazel build cache
        uses: actions/cache@v4
        with:
          path: |
            .bazel-cache/disk
            .bazel-cache/repo
          key: bazel-${{ runner.os }}-${{ inputs.manifest_branch }}-${{ hashFiles('patches/**', 'configs/**') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ inputs.manifest_branch }}-
            bazel-${{ runner.os }}-

      - name: Restore kernel source cache (mempercepat repo sync)
        uses: actions/cache@v4
        with:
          path: android-kernel
          key: kernel-src-${{ inputs.manifest_branch }}-${{ github.run_id }}
          restore-keys: |
            kernel-src-${{ inputs.manifest_branch }}-

      - name: Init kernel manifest
        run: |
          mkdir -p android-kernel && cd android-kernel
          if [ ! -d .repo ]; then
            repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b ${{ inputs.manifest_branch }}
          fi

      - name: Handle deprecated branch, then sync
        run: |
          cd android-kernel
          FORMATTED_BRANCH="${{ inputs.manifest_branch }}"
          FORMATTED_BRANCH=${FORMATTED_BRANCH#common-}
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          repo --trace sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Bypass strict defconfig check
        run: |
          sed -i '/check_defconfig/d' android-kernel/common/build.config.gki

      - name: Apply Droidspace kABI patch
        run: |
          cd android-kernel/common
          if patch -p1 --dry-run < ../../patches/${{ inputs.kabi_patch }} > /dev/null 2>&1; then
            patch -p1 < ../../patches/${{ inputs.kabi_patch }}
            echo "Patch diterapkan."
          elif patch -p1 -R --dry-run < ../../patches/${{ inputs.kabi_patch }} > /dev/null 2>&1; then
            echo "Patch sudah ter-apply (dari cache source). Skip."
          else
            echo "::error::Patch GAGAL diterapkan. Cek isi patches/${{ inputs.kabi_patch }}"
            exit 1
          fi

      - name: Merge Droidspace fragment & Disable KUnit
        run: |
          DEFCONFIG=android-kernel/common/arch/arm64/configs/gki_defconfig
          FRAGMENT=configs/droidspace.fragment
          # restore original kalau source dari cache (biar gak merge dobel)
          if [ -f "${DEFCONFIG}.orig" ]; then cp "${DEFCONFIG}.orig" "$DEFCONFIG"; fi
          cp "$DEFCONFIG" "${DEFCONFIG}.orig"

          python3 - "$DEFCONFIG" "$FRAGMENT" << 'EOF'
          import re, sys

          def_path, frag_path = sys.argv[1], sys.argv[2]

          def get_key(l):
              m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=', l)
              if m: return m.group(1)
              m = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set', l)
              if m: return m.group(1)
              return None

          with open(def_path) as f:
              base = f.readlines()
          with open(frag_path) as f:
              frag = [l for l in f.readlines() if get_key(l)]

          # Matikan KUnit & test modules yang memicu KMI symbol violations
          extra_fix_configs = [
              "# CONFIG_KUNIT is not set\n",
              "# CONFIG_RUNTIME_TESTING_MENU is not set\n",
              "# CONFIG_NET_9P is not set\n",
              "CONFIG_TRIM_UNUSED_KSYMS=n\n"
          ]
          frag.extend(extra_fix_configs)

          frag_keys = {get_key(l) for l in frag if get_key(l)}
          new_base = [l for l in base if get_key(l) not in frag_keys]

          with open(def_path, 'w') as f:
              f.writelines(new_base)
              f.write("\n# --- Droidspace fragment & KMI fix (merged) ---\n")
              f.writelines(frag)

          print(f"Merged {len(frag_keys)} keys from fragment and fixes.")
          EOF

          echo "=== DIFF ==="
          diff "${DEFCONFIG}.orig" "$DEFCONFIG" || true

      - name: Bypass KMI Symbol Check di Bazel BUILD
        run: |
          cd android-kernel
          # Nonaktifkan pengecekan strict KMI di file Bazel
          sed -i 's/kmi_symbol_list_strict_mode = True/kmi_symbol_list_strict_mode = False/g' common/BUILD.bazel || true
          sed -i 's/kmi_symbol_list = /# kmi_symbol_list = /g' common/BUILD.bazel || true

      - name: Build kernel (Bazel + cache, untrimmed, no KMI check)
        run: |
          cd android-kernel
          mkdir -p "$BAZEL_DISK_CACHE" "$BAZEL_REPO_CACHE"

          tools/bazel build --config=fast --lto=${{ inputs.lto_mode }} \
            --notrim \
            --nokmi_symbol_list_strict_mode \
            --disk_cache="$BAZEL_DISK_CACHE" \
            --repository_cache="$BAZEL_REPO_CACHE" \
            //common:kernel_aarch64_dist

      - name: Locate build output
        run: |
          find android-kernel/bazel-bin -maxdepth 6 -iname "Image" | tee found_outputs.txt
          echo "=== Isi found_outputs.txt ==="
          cat found_outputs.txt

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-6.6.77-droidspace
          path: android-kernel/bazel-bin/common/kernel_aarch64/Image
          if-no-files-found: warn
          retention-days: 14
